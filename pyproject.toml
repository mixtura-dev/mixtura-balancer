[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "balancer-test"
version = "0.1.0"
description = "Game team balancer with C++ optimization"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Your Team", email = "your.email@example.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "balance-engine",
    "fastapi[all]>=0.135.1",
    "faststream[rabbit]>=0.6.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.13.1",
    "redis>=7.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0", "ruff>=0.1.0", "mypy>=1.0"]


[project.urls]
Repository = "https://github.com/yourusername/balancer-test"
Documentation = "https://github.com/yourusername/balancer-test#readme"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "balance_engine.*",
    "fastapi.*",
    "faststream.*",
    "pydantic.*",
]
ignore_missing_imports = true

[tool.uv.sources]
balance-engine = { path = "cpp_balancer" }

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]
